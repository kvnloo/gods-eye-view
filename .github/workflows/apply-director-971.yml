name: "Apply director 971 support patch"

on:
  push:
    branches:
      - assist/director-971-five-bugs
    paths:
      - .github/workflows/apply-director-971.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: assist/director-971-five-bugs
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - run: python scripts/apply-director-971.py
      - name: Format and verify focused regression
        run: |
          npx prettier --write src/scenes/director.js src/scenes/director971.test.mjs scripts/format-scope.json
          node --test src/scenes/director971.test.mjs
          npm run format:check
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scenes/director.js src/scenes/director971.test.mjs scripts/format-scope.json
          git commit -m "fix(director): keep scene results and save status accurate (#971)"
          git push origin HEAD:assist/director-971-five-bugs
