name: Apply director #971 support patch

on:
  push:
    branches:
      - assist/director-971-five-bugs
    paths:
      - .github/workflows/apply-director-971.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assist/director-971-five-bugs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - name: Apply focused source and regression patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/scenes/director.js')
          text = path.read_text()

          # An unreadable/newer saved project must not let startup migrations
          # overwrite either the saved project or its manual-recovery checkpoint.
          start = text.index('    this._bootstrapLegacyShotPacks();')
          end = text.index('    this._initUI();', start)
          block = text[start:end]
          indented = ''.join(
              ('  ' + line if line.strip() else line)
              for line in block.splitlines(keepends=True)
          )
          text = text[:start] + '    if (!this._storageReadError) {\n' + indented + '    }\n' + text[end:]

          save_start = text.index('  _saveProject() {')
          save_end = text.index('  /** Surface a "scene not saved" notice', save_start)
          save = text[save_start:save_end]
          old = """      );
              return;
            }
            this._project.updatedAt = new Date().toISOString();"""
          new = """      );
              return false;
            }
            this._project.updatedAt = new Date().toISOString();"""
          if old not in save:
              raise SystemExit('read-error save return anchor missing')
          save = save.replace(old, new, 1)
          old = '      localStorage.setItem(STORAGE_KEY, payload);\n'
          if old not in save:
              raise SystemExit('successful save anchor missing')
          save = save.replace(old, old + '      return true;\n', 1)
          old = """      this._toastStorageError(
                e instanceof SceneDocumentError
                  ? `Scene not saved — ${e.message}`
                  : undefined,
              );
            }
          }

"""
          new = """      this._toastStorageError(
                e instanceof SceneDocumentError
                  ? `Scene not saved — ${e.message}`
                  : undefined,
              );
              return false;
            }
          }

"""
          if old not in save:
              raise SystemExit('failed save return anchor missing')
          save = save.replace(old, new, 1)
          text = text[:save_start] + save + text[save_end:]

          replacements = [
              (
                  """    this._saveProject();
              this._shotOutcome('shot-captured', scene, shot);
              this._updateStatus(`Captured: ${scene.title} / ${shot.title}`);""",
                  """    const saved = this._saveProject();
              this._shotOutcome('shot-captured', scene, shot);
              if (saved)
                this._updateStatus(`Captured: ${scene.title} / ${shot.title}`);""",
              ),
              (
                  """    this._saveProject();
              this._shotOutcome('shot-updated', scene, shot);
              this._updateStatus(`Updated: ${scene.title} / ${shot.title}`);""",
                  """    const saved = this._saveProject();
              this._shotOutcome('shot-updated', scene, shot);
              if (saved)
                this._updateStatus(`Updated: ${scene.title} / ${shot.title}`);""",
              ),
              (
                  """    this._saveProject();
              if (render) {
                this._renderSceneSelect();
                this._renderShotList();
              }
              if (announce) {""",
                  """    const saved = this._saveProject();
              if (render) {
                this._renderSceneSelect();
                this._renderShotList();
              }
              if (announce && saved) {""",
              ),
              (
                  """      this._saveProject();
                  this._publish({ type: 'project-imported', project });
                  this._updateStatus(`Imported ${file.name}`);
                  return true;""",
                  """      const saved = this._saveProject();
                  this._publish({ type: 'project-imported', project });
                  if (saved) this._updateStatus(`Imported ${file.name}`);
                  return true;""",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('save-status caller anchor missing:\n' + old)
              text = text.replace(old, new, 1)

          old = """    let queue = this._buildPlaybackQueue(
              sceneId || this._selectedSceneId || this._project.scenes[0]?.id,
              { single },
            );"""
          new = """    const startSceneId =
              sceneId || this._selectedSceneId || this._project.scenes[0]?.id;
            let queue = this._buildPlaybackQueue(startSceneId, { single });"""
          if old not in text:
              raise SystemExit('playback start-scene anchor missing')
          text = text.replace(old, new, 1)

          old = '        ({ scene, shot }) => scene.id === sceneId && shot.id === afterShotId,\n'
          new = '        ({ scene, shot }) =>\n          scene.id === startSceneId && shot.id === afterShotId,\n'
          if old not in text:
              raise SystemExit('after-shot scene anchor missing')
          text = text.replace(old, new, 1)

          old = '      scenesRun: queue.length,\n'
          new = '      scenesRun: new Set(queue.map(({ scene }) => scene.id)).size,\n'
          if old not in text:
              raise SystemExit('scenesRun anchor missing')
          text = text.replace(old, new, 1)

          old = """    } finally {
              this._finishRun();
            }
          }

          /**
           * Advance to the next shot"""
          new = """    } finally {
              this._finishRun();
            }
            return { started: true, shots: queue.length };
          }

          /**
           * Advance to the next shot"""
          if old not in text:
              raise SystemExit('successful startScene return anchor missing')
          text = text.replace(old, new, 1)
          path.write_text(text)

          test = r'''import assert from 'node:assert/strict';
          import test from 'node:test';
          import { SceneDirector } from './director.js';

          const STORAGE_KEY = 'godsEyeView.sceneProject.v2';
          const CHECKPOINT_KEY = 'godsEyeView.sceneProject.checkpoint.v1';
          const pose = {
            lat: 10,
            lon: 20,
            alt: 500000,
            heading: 0,
            pitch: -40,
            roll: 0,
          };
          const shot = (id) => ({
            id,
            title: id,
            durationSec: 0.2,
            holdSec: 0,
            camera: pose,
            visual: { style: 'normal' },
            layers: {},
          });
          const project = JSON.stringify({
            version: 3,
            scenes: [
              { id: 's', title: 'S', shots: [shot('a'), shot('b')] },
            ],
          });

          function classList() {
            return {
              add() {},
              remove() {},
              toggle() {},
              contains: () => false,
            };
          }

          function installDocument() {
            globalThis.document = {
              getElementById: () => null,
              createElement: () => ({
                classList: classList(),
                style: {},
                dataset: {},
                appendChild() {},
                remove() {},
                click() {},
                addEventListener() {},
                removeEventListener() {},
                setAttribute() {},
              }),
              addEventListener() {},
              removeEventListener() {},
              body: { classList: classList(), appendChild() {} },
            };
          }

          function make(initial) {
            const stored = new Map(Object.entries(initial));
            const storage = {
              stored,
              full: false,
              getItem: (key) => stored.get(key) ?? null,
              setItem(key, value) {
                if (this.full)
                  throw new DOMException('quota exceeded', 'QuotaExceededError');
                stored.set(key, String(value));
              },
              removeItem: (key) => stored.delete(key),
            };
            globalThis.localStorage = storage;
            const viewer = {
              camera: {
                flyTo: (options) =>
                  Promise.resolve().then(() => options.complete?.()),
                cancelFlight() {},
              },
            };
            const style = {
              runImmediateNavigation: (_name, run) => run(),
              getCameraState: () => pose,
              getVisualState: () => ({ style: 'normal' }),
              setRecordingMode() {},
              applyVisualState: async () => true,
            };
            const data = {
              getAll: () => [],
              getLayerParams: () => null,
              setEnabled: async () => true,
              setLayerParams: () => true,
            };
            return { director: new SceneDirector(viewer, style, data), storage };
          }

          test('SceneDirector keeps recovery data, failed-save status, and run results accurate (#971)', async (t) => {
            const priorDocument = globalThis.document;
            const priorStorage = globalThis.localStorage;
            installDocument();
            t.after(() => {
              if (priorDocument === undefined) delete globalThis.document;
              else globalThis.document = priorDocument;
              if (priorStorage === undefined) delete globalThis.localStorage;
              else globalThis.localStorage = priorStorage;
            });

            let made = make({
              [STORAGE_KEY]: '{"version":99,"scenes":[]}',
              [CHECKPOINT_KEY]: 'EARLIER-CHECKPOINT',
            });
            assert.equal(
              made.storage.stored.get(STORAGE_KEY),
              '{"version":99,"scenes":[]}',
            );
            assert.equal(
              made.storage.stored.get(CHECKPOINT_KEY),
              'EARLIER-CHECKPOINT',
            );
            await made.director.destroy();

            made = make({ [STORAGE_KEY]: project });
            let status = '';
            made.director.subscribe(({ state }) => {
              status = state.status;
            });
            made.storage.full = true;
            made.director.captureShot();
            assert.match(status, /^Scene not saved/);
            await made.director.destroy();

            made = make({ [STORAGE_KEY]: project });
            const options = { single: true, preview: false };
            assert.deepEqual(await made.director.startScene('s', options), {
              started: true,
              shots: 2,
            });
            assert.equal(made.director._lastRun.scenesRun, 1);
            assert.deepEqual(
              await made.director.startScene(undefined, {
                ...options,
                afterShotId: 'a',
              }),
              { started: true, shots: 1 },
            );
            await made.director.destroy();
          });
          '''
          # Remove the workflow's YAML indentation from the JS heredoc.
          lines = test.splitlines()
          Path('src/scenes/director971.test.mjs').write_text(
              '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
              + '\n'
          )

          scope = Path('scripts/format-scope.json')
          scope_text = scope.read_text()
          entry = '  "src/scenes/director971.test.mjs",\n'
          if entry not in scope_text:
              anchor = '  "src/data/inputOwnership.test.mjs",\n'
              if anchor not in scope_text:
                  raise SystemExit('format-scope anchor missing')
              scope_text = scope_text.replace(anchor, anchor + entry, 1)
              scope.write_text(scope_text)
          PY
      - name: Format and run focused regression
        run: |
          npx prettier --write src/scenes/director.js src/scenes/director971.test.mjs scripts/format-scope.json
          node --test src/scenes/director971.test.mjs
          npm run format:check
      - name: Commit clean support branch
        shell: bash
        run: |
          rm .github/workflows/apply-director-971.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scenes/director.js src/scenes/director971.test.mjs scripts/format-scope.json .github/workflows/apply-director-971.yml
          git commit -m "fix(director): keep scene results and save status accurate (#971)"
          git push origin HEAD:assist/director-971-five-bugs
