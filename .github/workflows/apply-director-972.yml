name: "Verify director 972 callback hardening"

on:
  push:
    branches:
      - assist/director-972-callback-hardening
    paths:
      - .github/workflows/apply-director-972.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: assist/director-972-callback-hardening
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - run: python scripts/apply-director-972.py
      - name: Format and verify focused regressions
        run: |
          npx prettier --write src/director/clock.js src/director/playback.js src/director/interactions/session.js src/director/callbackHardening.test.mjs scripts/format-scope.json
          node --test src/director/callbackHardening.test.mjs
          npm run format:check
      - name: Commit verified formatting and scope
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/director/clock.js src/director/playback.js src/director/interactions/session.js src/director/callbackHardening.test.mjs scripts/format-scope.json
          git commit -m "test(director): verify callback failure ownership (#972)"
          git push origin HEAD:assist/director-972-callback-hardening
