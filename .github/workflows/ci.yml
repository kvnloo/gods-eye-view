name: CI

on:
  pull_request:
  push:
    branches: [nightly, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  factory-base:
    name: Fork branch policy
    if: github.repository == 'kvnloo/gods-eye-view' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse feature PRs to mirror and stable branches
        env:
          BASE: ${{ github.base_ref }}
        run: |
          case "$BASE" in
            main|staging) echo '::error::Target nightly. Main mirrors upstream; staging is fast-forward promotion only.'; exit 1 ;;
          esac

  factory:
    # Required on the fork: the gev-ci/* statuses this posts on the exact head.
    name: Factory gates
    if: >-
      github.repository == 'kvnloo/gods-eye-view' && (
        (github.event_name == 'pull_request' && contains(fromJSON('["nightly","staging"]'), github.base_ref)) ||
        (github.event_name == 'push' && contains(fromJSON('["refs/heads/nightly","refs/heads/staging"]'), github.ref)))
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/factory-ci-sha.yml
    with:
      sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}

  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24.22.2, 26.x]
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: ${{ matrix.node == '24.22.2' && '1' || '0' }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run setup policy checks
        run: npm run doctor -- --json

      - name: Check adopted formatting
        run: npm run format:check

      - name: Check package boundaries
        run: npm run check:boundaries

      - name: Check published layer-token allocations
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run layer-token:check -- --base-ref "$BASE_SHA"

      - name: Check Data Library manifests and share tokens
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run library:check -- --base-ref "$BASE_SHA"

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  street-level-browser:
    # Hermetic: every Mapillary request is answered from fixtures, so the
    # dummy token below never leaves the page.
    name: Street Level browser gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEV_REQUIRE_ALLOCATION_GATE: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.2
          cache: npm

      - name: Install locked dependencies and headless Chrome
        run: npm ci

      - name: Build production bundle with a dummy Mapillary token
        env:
          MAPILLARY_CLIENT_TOKEN: 'MLY|0|qa-fixture'
        run: npm run build

      - name: Start the preview server
        env:
          MAPILLARY_CLIENT_TOKEN: 'MLY|0|qa-fixture'
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for attempt in $(seq 1 90); do
            curl -sf http://localhost:4173/ > /dev/null && exit 0
            sleep 2
          done
          cat preview.log
          exit 1

      - name: Street Level gate with Mapillary fixtures
        run: npm run qa:street-level:fixtures -- --strict --url http://localhost:4173

      - name: The whole application on the stub renderer, with no Cesium loaded
        run: |
          mkdir -p qa-artifacts
          npm run qa:stub-boot -- --json qa-artifacts/stub-boot.json

      - name: The renderer contract's logic checks on Cesium, headless
        run: |
          mkdir -p qa-artifacts
          npm run qa:conformance -- --json qa-artifacts/conformance.json

      - name: Preview server log
        if: failure()
        run: cat preview.log

      - name: Upload gate evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-gate-evidence
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  windows-onboarding:
    name: Windows onboarding
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.2
          cache: npm

      - name: Run the Pinokio install path
        run: node scripts/pinokio-install.mjs

      - name: Check adopted formatting
        run: npm run format:check

      - name: Check package boundaries
        run: npm run check:boundaries

      - name: Run focused onboarding tests
        run: node --test src/setupDoctor.test.mjs src/pinokioEnvironment.test.mjs src/pinokioPreflight.test.mjs src/pinokioLauncherContract.test.mjs src/keySetupHardening.test.mjs src/mapStartup.test.mjs src/hudSummaryResponse.test.mjs src/codexOauthRealtime.test.mjs

      - name: Build production bundle
        run: npm run build
