name: Format diagnostic

on:
  push:
    branches:
      - feat/camera-observed-corridor-fixture

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - name: Show formatter diff
        run: |
          npm run format
          git diff -- src/standalone/application.js src/standalone/observedTrafficFixture.js
          test -z "$(git status --short -- src/standalone/application.js src/standalone/observedTrafficFixture.js)"
