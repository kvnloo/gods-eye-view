name: Humanitarian format proof

on:
  push:
    branches:
      - exp/humanitarian-data-policy-20261003

permissions:
  contents: read

jobs:
  format-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - name: Print canonical formatted test
        run: |
          node scripts/format.mjs --write
          echo '===FORMATTED-BEGIN==='
          cat src/data/humanitarianDataPolicy.test.mjs
          echo '===FORMATTED-END==='
