name: Format PR 164 now
on: [push]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: exp/collaboration-authority-20261008
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/data/collaborationAuthority.js src/data/collaborationAuthority.test.mjs
      - run: |
          rm .github/workflows/format-now-164.yml .github/workflows/fix-format-164.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/collaborationAuthority.js src/data/collaborationAuthority.test.mjs .github/workflows/format-now-164.yml .github/workflows/fix-format-164.yml
          git commit -m "chore(collab): apply repository formatting"
          git push origin HEAD:exp/collaboration-authority-20261008
