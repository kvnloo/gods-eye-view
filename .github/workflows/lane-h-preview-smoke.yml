name: Lane H Historic Fires preview (fork smoke)

on:
  push:
    branches:
      - ci/lane-h-preview-20261013

permissions:
  contents: read

concurrency:
  group: lane-h-preview-20261013
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEV_REQUIRE_ALLOCATION_GATE: '0'
      MAPILLARY_CLIENT_TOKEN: 'MLY|0|qa-fixture'
    steps:
      - name: Checkout fork preview
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Use supported Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install locked dependencies and Chrome
        run: npm ci
      - name: Check formatting and package boundaries
        run: |
          npm run format:check
          npm run check:boundaries
      - name: Run full unit suite
        run: npm test
      - name: Build preview
        run: npm run build
      - name: Start preview server
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for attempt in $(seq 1 90); do
            curl -sf http://localhost:4173/ > /dev/null && exit 0
            sleep 2
          done
          cat preview.log
          exit 1
      - name: Keyless Historic Fires browser proof
        run: npm run qa:fire-history:fixtures -- --url http://localhost:4173
      - name: Preview server log on failure
        if: failure()
        run: cat preview.log || true
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lane-h-fire-history-evidence
          path: qa-artifacts/fire-history/
          if-no-files-found: ignore
          retention-days: 7
