name: Motion gate format diagnostic

on:
  push:
    branches:
      - perf/motion-safe-imagery-recut-20261003

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - name: Show formatter diff
        run: |
          npm run format
          git diff -- src/services/cameraMotionGate.test.mjs src/layers/recentImagery/rendering.test.mjs
          test -z "$(git status --short -- src/services/cameraMotionGate.test.mjs src/layers/recentImagery/rendering.test.mjs)"
