name: SUMO corridor evidence

on:
  push:
    branches:
      - infra/sumo-corridor-ab-20261012
      - infra/sumo-safety-receipt-gate-20261012
    paths:
      - '.github/workflows/traffic-sumo-corridor.yml'
      - 'scripts/traffic-scenarios/**'
      - 'src/data/trafficScenario*.js'
      - 'src/data/trafficScenario*.mjs'
  # Same-repo draft PRs expose runnable checks to reviewers. Push runs alone
  # are not visible through the available PR-only workflow lookup.
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - infra/sumo-corridor-ab-20261012
    paths:
      - '.github/workflows/traffic-sumo-corridor.yml'
      - 'scripts/traffic-scenarios/**'
      - 'src/data/trafficScenario*.js'
      - 'src/data/trafficScenario*.mjs'

permissions:
  contents: read

concurrency:
  group: sumo-corridor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corridor:
    # Never execute fork-contributed PR code on this experimental runner.
    if: >-
      github.repository == 'kvnloo/gods-eye-view' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == 'kvnloo/gods-eye-view')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out the exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Use the supported Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0

      - name: Run existing receipt tests and new harness tests
        run: |
          node --test src/data/trafficScenarioComparison.test.mjs src/data/trafficScenarioSumo.test.mjs
          python3 scripts/traffic-scenarios/test-sumo-statistics-receipt.py -v
          python3 scripts/traffic-scenarios/test-sumo-corridor.py -v

      - name: Install the pinned real simulator
        run: |
          python3 -m venv "$RUNNER_TEMP/sumo-env"
          "$RUNNER_TEMP/sumo-env/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: eclipse-sumo==1.24.0
          echo "$RUNNER_TEMP/sumo-env/bin" >> "$GITHUB_PATH"
          mkdir -p qa-artifacts
          "$RUNNER_TEMP/sumo-env/bin/python" -m pip freeze > qa-artifacts/sumo-environment.txt

      - name: Run three fixed-versus-actuated pairs and an incomplete control
        run: python3 scripts/traffic-scenarios/run-sumo-corridor.py --output qa-artifacts/sumo-corridor

      - name: Print the actual execution evidence
        if: always()
        run: |
          if [ -f qa-artifacts/sumo-corridor/summary.json ]; then
            cat qa-artifacts/sumo-corridor/summary.json
          fi
          if [ -d qa-artifacts/sumo-corridor ]; then
            find qa-artifacts/sumo-corridor -name '*.log' -maxdepth 1 -exec tail -n 25 {} \;
          fi

      - name: Preserve receipts, synthetic inputs and simulator logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sumo-corridor-${{ github.sha }}
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
